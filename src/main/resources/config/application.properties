# Loaded on top of the upstream batch-indexing application.properties (classpath:/config wins),
# so every upstream default and alfresco.reindex.* tuning property still applies.
spring.application.name=alfresco-community-live-indexing

# Fixed: removes the upstream watermark store/continuous scheduler (never touch the batch cursor)
alfresco.reindex.jobName=liveIndex

# Live trigger
live.topic=alfresco.repo.event2
live.flush-interval=1s
# true = trashcan deletes remove the document (ACS 26.2.0 + batch indexer 5.7.1 semantics).
# false = upstream 5.10 soft delete (ALIVE=false), for ACS versions whose query path filters ALIVE.
live.hard-delete-archived=true
spring.jms.pub-sub-domain=true
spring.activemq.broker-url=tcp://localhost:61616

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-components=always
