# Dev/validation stack: ACS Community 26.2 + Alfresco Search Community (OpenSearch) + this service.
# Replace the placeholder secrets before using anywhere real.
x-secrets: &secrets
  DB_PASSWORD: &dbpass alfresco
  SHARED_SECRET: &secret change-me-shared-secret

services:
  postgres:
    image: postgres:15.6
    environment:
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: *dbpass
      POSTGRES_DB: alfresco
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfresco"]
      interval: 10s
      retries: 10

  activemq:
    image: alfresco/alfresco-activemq:5.18-jre17-rockylinux8
    ports:
      - "8161:8161"

  transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.4.3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 15s
      retries: 20
      start_period: 30s

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      retries: 20
      start_period: 30s

  alfresco:
    image: alfresco/alfresco-content-repository-community:26.2.0
    depends_on:
      postgres: {condition: service_healthy}
      transform-core-aio: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      activemq: {condition: service_started}
    environment:
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco
        -Ddb.url=jdbc:postgresql://postgres:5432/alfresco
        -Dindex.subsystem.name=elasticsearch
        -Delasticsearch.host=opensearch
        -Delasticsearch.port=9200
        -Delasticsearch.indexName=alfresco
        -Delasticsearch.createIndexIfNotExists=true
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=change-me-shared-secret
        -DlocalTransform.core-aio.url=http://transform-core-aio:8090/
        -Dmessaging.broker.url="failover:(nio://activemq:61616)?timeout=3000&jms.useCompression=true"
        -Dcsrf.filter.enabled=false
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
        -XX:MaxRAMPercentage=50
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready- || exit 1"]
      interval: 20s
      retries: 30
      start_period: 120s

  batch-indexer:
    image: alfresco/alfresco-elasticsearch-batch-indexing:5.7.1
    profiles: ["batch"] # start with --profile batch; stopped by default to observe live latency alone
    depends_on:
      alfresco: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alfresco
      SPRING_DATASOURCE_USERNAME: alfresco
      SPRING_DATASOURCE_PASSWORD: *dbpass
      SPRING_ELASTICSEARCH_URIS: http://opensearch:9200
      ELASTICSEARCH_INDEXNAME: alfresco
      ALFRESCO_ACS_URL: http://alfresco:8080
      ALFRESCO_ACCEPTEDCONTENTMEDIATYPESCACHE_BASEURL: http://transform-core-aio:8090/transform/config
      ALFRESCO_CONTENT_TRANSFORM_SHAREDSECRET: *secret

  live-indexing:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      alfresco: {condition: service_healthy}
    environment:
      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/alfresco
      SPRING_DATASOURCE_USERNAME: alfresco # use a read-only user in production
      SPRING_DATASOURCE_PASSWORD: *dbpass
      SPRING_ELASTICSEARCH_URIS: http://opensearch:9200
      ELASTICSEARCH_INDEXNAME: alfresco
      ALFRESCO_ACS_URL: http://alfresco:8080
      ALFRESCO_ACCEPTEDCONTENTMEDIATYPESCACHE_BASEURL: http://transform-core-aio:8090/transform/config
      ALFRESCO_CONTENT_TRANSFORM_SHAREDSECRET: *secret
    ports:
      - "8091:8080"
